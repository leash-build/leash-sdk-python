[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leash-sdk"
version = "0.4.0"
description = "Leash platform SDK - unified Leash() client with auth, env, and integrations namespaces"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24,<1.0",
    "PyJWT>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://leash.build"
Documentation = "https://leash.build/docs/sdk"
Source = "https://github.com/leash-build/leash-sdk-python"

[tool.setuptools.packages.find]
include = ["leash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
